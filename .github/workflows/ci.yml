name: CI

# ==============================================================================
# Student-facing feedback loop. Runs the same suite the autograder runs, so a
# student sees pass/fail on every push without waiting for a grade.
#
# FACULTY: this is NOT the grader.
#
#   This workflow          -> runs in the STUDENT's repo, for their benefit.
#                             Its result has no effect on any score.
#   The `tests` block      -> in the classroom config repo's assignments.json,
#                             is what actually produces the grade.
#
#   Keeping the two consistent is a manual discipline, not an enforced one.
#   When you change the test command in one, change it in the other. If they
#   drift, students see green here and score zero there, and you will hear
#   about it during the last hour before the deadline.
#
#   Why have both at all? Turnaround. Grading runs on submission; this runs on
#   every push. Students who can see red immediately fix it themselves instead
#   of arriving at office hours with "it didn't work."
#
# ------------------------------------------------------------------------------
# TWO MODES, because the same file runs in two very different repos
# ------------------------------------------------------------------------------
#
#   TEMPLATE repo (this one, or any repo flagged is_template):
#       The starter is unimplemented on purpose — every stub raises. Running the
#       full suite here would fail 12/12 and paint the template with a red X,
#       which is a terrible first impression for a repo whose entire job is to
#       be copied and to look trustworthy while doing it.
#       So the template checks that the suite COLLECTS: imports cleanly and
#       yields the expected number of cases. That is the meaningful assertion
#       for scaffolding — it catches a broken import or a renamed module, which
#       are the ways a template actually breaks.
#
#   STUDENT repo (a copy — is_template is false):
#       Full suite, real pass/fail. Red is the point.
#
#   Detection uses `is_template` rather than a hardcoded repo name so that a
#   fork of this template into a new course keeps working with no edits.
# ==============================================================================

on:
  push:
    branches: ['**']    # FACULTY: all branches on purpose — students who work
                        # on a side branch still get feedback there.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # FACULTY: read-only, and it should stay that way. This
                        # workflow runs code students wrote. Do not add write
                        # scopes or expose secrets here — a student can print
                        # anything this job can read.

env:
  # FACULTY: update if you change the number of test cases. The template-mode
  # check asserts this exact count, so a test accidentally deleted or shadowed
  # by a duplicate name gets caught here instead of silently reducing what
  # students are graded on.
  EXPECTED_CASES: '12'

jobs:
  test:
    runs-on: ubuntu-latest

    # FACULTY: a real ceiling, not a formality. An infinite loop in a student
    # submission otherwise burns Actions minutes until the 6-hour default kills
    # it. With a class of 60 pushing repeatedly, that is the whole org quota.
    # Raise it if your suite genuinely needs longer; do not remove it.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # FACULTY: pin it. "Latest" means a student's
                                   # grade can change because GitHub moved a
                                   # default, which is impossible to explain.
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Decide mode
        id: mode
        # `github.event.repository.is_template` is absent on some event types,
        # so treat anything that is not an explicit "true" as a student repo.
        # Defaulting to student mode is the safe direction: the worst case is a
        # template showing red, never a student repo silently skipping tests.
        run: |
          if [ "${{ github.event.repository.is_template }}" = "true" ]; then
            echo "value=template" >> "$GITHUB_OUTPUT"
            echo "Template repo — validating that the suite collects."
          else
            echo "value=student" >> "$GITHUB_OUTPUT"
            echo "Student repo — running the full suite."
          fi

      - name: Validate test suite collects (template repo)
        if: steps.mode.outputs.value == 'template'
        run: |
          set -euo pipefail
          python3 -m pytest --collect-only -q
          found=$(python3 -m pytest --collect-only -q 2>/dev/null | grep -cE '^tests/.*::')
          echo "collected $found case(s), expected $EXPECTED_CASES"
          if [ "$found" -ne "$EXPECTED_CASES" ]; then
            echo "::error::Expected $EXPECTED_CASES test cases, collected $found. Update EXPECTED_CASES if this was intentional."
            exit 1
          fi

      - name: Run tests (student repo)
        if: steps.mode.outputs.value == 'student'
        run: python3 -m pytest -q

      - name: Check the Verification Log was filled in
        # FACULTY: advisory only, and deliberately so. A missing log should not
        # suppress the test signal — those are two different things to assess,
        # and conflating them means a student who forgot to sign gets no
        # feedback on code that was fine.
        #
        # `if: always()` so this still runs when the tests above failed. The
        # student most likely to skip the log is the one whose tests are red.
        #
        # The log is graded by you, not here. Machine-checking whether a
        # reflective document is *honest* is not something CI can do, and
        # pretending otherwise invites students to write for the checker.
        if: always() && steps.mode.outputs.value == 'student'
        run: |
          if grep -qE '^Name:\s*$' VERIFICATION-LOG.md 2>/dev/null; then
            echo "::warning file=VERIFICATION-LOG.md::Verification Log is not signed — fill it in before your final push."
          fi
